name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://docflow:docflow@localhost:5432/docflow_test
      VITE_API_BASE_URL: https://docflow-xayj.onrender.com

    steps:
      # Actions pinned to commit SHAs (Phase 7 finding 12)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # shared must be built before dependents can typecheck against its dist types
      - run: pnpm --filter @docflow/shared run build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # Fails on a new high/critical advisory; ignores are justified in pnpm-workspace.yaml
      - run: pnpm audit --audit-level high

  # Browser tests against the real API (local storage driver, no B2) and the production web
  # build with its security headers; includes axe accessibility scans of every screen.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgres://docflow:docflow@localhost:5432/docflow_e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docflow/shared run build
      - run: pnpm --filter @docflow/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @docflow/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
