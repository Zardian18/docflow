packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra/*'
allowBuilds:
  esbuild: true
  workerd: true
overrides:
  # Runtime advisories in the API's dependencies (security review M2, D33):
  # GHSA-rxp7-6hxx-x8q5 (IPv6 zone-id DoS) via @fastify/rate-limit
  'ip-address': 10.7.6
  # Scheme/host confusion advisories via ajv and fast-json-stringify; same majors, drop-in
  'fast-uri@3': 3.1.9
  'fast-uri@4': 4.2.3
  # Dev-only advisories below (Phase 7 finding 12); nothing here ships in the API image or the SPA.
  # GHSA-wq5f-xc86-pv6w: wrangler's local simulator pins 0.35.4; the patch release is drop-in
  'miniflare>sharp': 0.35.5
  # GHSA-67mh-4wv8-2f99 (dev-server CORS): drizzle-kit's TS config loader pins esbuild 0.18;
  # it only uses transform, which is unchanged in 0.25
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Zod memory exhaustion on oversized collections (patched 4.6.6): the React hooks lint rule
  # accepts zod ^3.25 || ^4, so the app's own patched version is drop-in
  'eslint-plugin-react-hooks>zod': 4.6.7
  # undici DoS / redirect / TLS advisories (patched 7.30.1): wrangler's local simulator only,
  # same minor line
  'miniflare>undici': 7.30.1
