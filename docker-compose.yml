# Local Postgres for development and integration tests.
#   docker compose up -d
#   DATABASE_URL=postgres://docflow:docflow@localhost:5432/docflow
#   TEST_DATABASE_URL=postgres://docflow:docflow@localhost:5432/docflow
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docflow']
      interval: 5s
      retries: 10

volumes:
  pgdata:
